    "clearml[s3]>=1.16.0",
    "cloudflare==4.3.1",
    "confluent-kafka==2.6.0,<3",
    "cryptography==46.0.5,<47",
    "defusedxml==0.7.1,<0.8",
    "email-validator==2.2.0,<3",
    "fastapi==0.128.0",
    "fastapi-cli==0.0.4,<0.0.5",
    "fastapi-limiter==0.1.6,<0.2",
    "google-cloud-dns==0.36.0",
    "grpcio==1.69.0,<2",
    "httpcore==1.0.9,<2",
