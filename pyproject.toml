    "huggingface-hub==1.2.3",
    "jinja2==3.1.6,<4",
    "kubernetes==31.0.0,<32",
    "lago-python-client==1.36.0",
    "loguru==0.7.3,<0.8",
    "lxml==5.3.1,<6",
    "mysql-connector-python==9.2.0,<10",
    "novu==1.14.0",
    "opendal==0.45.16,<0.46",
    "orjson==3.11.5",
    "pendulum==3.0.0,<4",
    "pillow==12.1.1,<13",
    "phonenumbers==8.13.55,<9",
    "psutil==7.0.0,<8",
    "psycopg2-binary==2.9.10,<3",
    "pyasn1==0.6.2",
    "pydantic==2.12.0",
    "pydantic-settings==2.12.0",
    "pydash==8.0.4,<9",
    "pyjwt==2.8.0,<3",
    "pypdf==6.7.1",
    "python-digitalocean==1.17.0,<2",
    "python-http-client==3.3.7,<4",
    "python-keycloak==5.1.1,<6",
    "pyyaml==6.0.1,<7",
    "redis==6.2.0,<7",
    "requests==2.32.4",
    "sendgrid==6.11.0,<7",
    "setuptools==80.7.1,<81",
    "six==1.16.0,<2",
    "slack-sdk==3.33.5,<4",
    "starlette>=0.50,<0.51",
    "starlette-prometheus>=0.10.0",
    "stripe==11.5.0,<12",
    "supervisor==4.2.5,<5",
    "temporalio==1.21.1",
    "urllib3==2.6.3",
    "uuid7==0.1.0",
    "uvicorn==0.30.3,<0.31",
]

[dependency-groups]
dev = [
    "pre-commit==4.5.1",
    "pytest>=8.3.4,<9",
    "pytest-cov>=6.0.0,<7",
    "pytest-asyncio>=0.25.0,<0.26",
    "ruff==0.9.10",
    "pytest-order>=1.3.0,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

target-version = "py313"

lint.flake8-quotes = { inline-quotes = 'double', multiline-quotes = 'double' }

lint.allowed-confusables = ["−", "ρ", "∗"]

lint.dummy-variable-rgx = "_+$|(_[a-zA-Z0-9_]*[a-zA-Z0-9]+?$)|dummy|^ignored_|^unused_"

# (optional) list included tests here:
lint.select = [
  "A",   # flake8-builtins
  "B",   # flake8-bugbear
  "C",   # flake8-comprehensions
  "D",   # pydocstyle
  "E",   # pycodestyle ( Error )
  "F",   # Pyflakes
  "FBT", # flake8-boolean-trap
  "I",   # isort
  "N",   # pep8-naming
  "Q",   # flake8-quotes
  "RUF", # Ruff-specific rules
  "S",   # flake8-bandit
  "W",   # pycodestyle ( Warning )
  "UP",  # pyupgrade
  "YTT", # flake8-2020
  "BLE", # flake8-blind-except
  "RET", # flake8-return
  #  "COM", # flake8-commas
  "EXE", # flake8-executable
  "ANN", # flake8-annotations
  "G",   # flake8-logging-format
  "INT", # flake8-gettext
  "TID", # flake8-tidy-imports
  "TCH", # flake8-type-checking
  "TRY", # tryceratops
]


# (optional) list skipped tests here:
lint.ignore = [
  "B007",   # Loop control variable not used within loop body
  "B008",   # Do not perform function call in argument defaults
  "B023",   # Function definition does not bind loop variable {name}
  "B904",   # Within an except clause, raise exceptions with raise ... from err or raise ... from None to distinguish them from errors in exception handling
  "C408",   # Unnecessary {obj_type} call (rewrite as a literal)
  "E402",   # Module level import not at top of file
  "E731",   # Do not assign a lambda expression, use a def
  "N802",   # Function name should be lowercase
  "N815",   # Variable name in function should be lowercase
  "RUF001", # String contains ambiguous unicode character
  "RUF003", # Comment contains ambiguous unicode character
  "UP006",  # Use {} for type annotations
  "Q000",   # Double quotes found but single quotes preferred
  "D100",   # Missing docstring in public module
  "D101",   # Missing docstring in public class
  "D213",   # Multi-line docstring summary should start at the second line
  "B027",   # {name} is an empty method in an abstract base class, but has no abstract decorator
  "S102",   # Use of exec detected
  "C901",   # {name} is too complex ({complexity} > {max_complexity})
  "FBT003", # Boolean positional value in function call
  "S101",   # Use of assert detected
  "TID252", # Relative imports from parent modules are banned
  "FBT001", # Boolean positional arg in function definition
  "FBT002", # Boolean default value in function definition
  "E402",   # Module level import not at top of file
  "A001",   # Variable {name} is shadowing a python builtin
  "A002",   # Argument {name} is shadowing a python builtin
  "A003",   # Class attribute {name} is shadowing a python builtin
  "S105",   # Possible hardcoded-password-string
  "S106",   # Possible hardcoded-password-func-arg
  "N818",   # Exception name {name} should be named with an Error suffix
  "W292",   # No newline at end of file
  "D400",   # First line should end with a period
  "D200",   # One-line docstring should fit on one line
  "D203",   # 1 blank line required before class docstring
  "D415",   # First line should end with a period, question mark, or exclamation point
  "D205",   # 1 blank line required between summary line and description
  "D212",   # Multi-line docstring summary should start at the first line
  "D107",   # Missing docstring in __init__
  "D206",   # Docstring should be indented with spaces, not tabs
  "BLE001", # Do not catch blind exception
  "D404",   # First word of the docstring should not be "This"
  "TRY300", # use`else` block in try except
  "D401",   # First line of docstring should be in imperative mood
  "TRY003", # suppress long exception messages
  "S320",   # Using `lxml` to parse untrusted data is known to be vulnerable to XML attacks
  "I001",   # ignore unorganized imports
  "D106",   # ignore missing docstring for nested classes
  "TCH003", # ignore moving types under type checking block
  "TCH002", # ignore moving types under type checking block
  "RET505", # ignore `elif` after `return` statement
  "TRY002", # ignore using `except Exception`
  "S603",   # ignore using `os.system`
  "TRY201", # ignore using `except Exception`
  "N999",   # ignore invalid module name
  "RET506", # ignore using `else` after `return`
  "ANN401",
  "D403", # ignore first letter of docstring should be Capital,
]

[tool.ruff.lint.per-file-ignores]
"app/gunicorn_conf.py" = ["S104", "T201"]
"app/core/jinjasql.py" = [
  "ANN001",
  "ANN201",
  "ANN101",
  "S311",
  "ANN202",
  "S701",
  "ANN204",
  "UP031",
  "UP038",
  "RET505",
  "RET507",
]
"app/middleware/auth.py" = ["RET505"]
"app/cli/temporal/activities/jeevesNovuSetup.py" = ["E501"]
"app/s3_utils.py" = ["S605"]
"app/cli/temporal/activities/aiVoiceSetup.py" = ["S605"]
"app/cli/temporal/activities/jeevesFetchLatestTag.py" = ["S607"]
