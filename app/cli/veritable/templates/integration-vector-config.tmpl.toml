"[log_schema]\nhost_key = \"host\"\nmessage_key = \"message\"\nsource_type_key = \"source_type\"\ntimestamp_key = \"timestamp\"\n\n# sources for logs\n\n[sources.custom_logs]\ntype = \"file\"\ninclude = [\"/var/log/supervisord/veritable_*\"]\nfingerprint.strategy = \"device_and_inode\"\n\n[sinks.vector_sink]\ntype = \"loki\"\ninputs = [ \"custom_logs\" ]\nendpoint = \"http://loki.monitoring-system.svc.cluster.local:3100\" \n[sinks.vector_sink.encoding]\ncodec = \"json\"\n[sinks.vector_sink.labels]\nname = \"veritable_custom_logs_"{{tenant_name}}"\""