kind: Component
metadata:
  name: statestore
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: cache.cache.svc.cluster.local:6379
    - name: redisPassword
      value: {{ op://Penknife/application-config/PENKNIFE_<<tenant>>/redis_password }}
    - name: actorStateStore #Specifies whether the state store is being used for actor state data.
      value: "true"
    - name: keyPrefix
      value: none