apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: veritable-worker-autoscaler
  namespace: <<tenant>>
spec:
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          policies:
          - periodSeconds: 90
            type: Pods
            value: 1
          stabilizationWindowSeconds: 300
        scaleUp:
          policies:
          - periodSeconds: 30
            type: Pods
            value: 2
          stabilizationWindowSeconds: 0
    scalingModifiers: {}
  fallback:
    failureThreshold: 3
    replicas: 1
  maxReplicaCount: 5
  minReplicaCount: 1
  pollingInterval: 10
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: veritable-worker
  triggers:
  - type: temporal
    metadata:
      endpoint: temporal-frontend.temporal.svc.cluster.local:7233
      namespace: veritable_<<tenant>>
      taskQueue: HIGH
      targetQueueSize: "20"
      activationTargetQueueSize: "10"
      queueTypes: workflow,activity
  - type: temporal
    metadata:
      endpoint: temporal-frontend.temporal.svc.cluster.local:7233
      namespace: veritable_<<tenant>>
      taskQueue: MEDIUM
      targetQueueSize: "20"
      activationTargetQueueSize: "10"
      queueTypes: workflow,activity
  - type: temporal
    metadata:
      endpoint: temporal-frontend.temporal.svc.cluster.local:7233
      namespace: veritable_<<tenant>>
      taskQueue: LOW
      targetQueueSize: "20"
      activationTargetQueueSize: "10"
      queueTypes: workflow,activity
