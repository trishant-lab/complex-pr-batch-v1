kind: Component
metadata:
  name: statestore
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: cache-new.{{tenant}}.svc.cluster.local:6379
    - name: redisPassword
      value: {{ open_brackets }}op://314e DevOps/integration/cache/cache-admin-password{{ close_brackets }}
    - name: actorStateStore #Specifies whether the state store is being used for actor state data.
      value: "true"
    - name: keyPrefix
      value: none