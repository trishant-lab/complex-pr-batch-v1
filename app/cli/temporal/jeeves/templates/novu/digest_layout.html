<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeeves Layout</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100% !important;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f8ff;
        }

        img {
            border: 0;
            outline: none;
            text-decoration: none;
        }
    </style>
</head>

<body style="margin: 0; padding: 0; background-color: #f0f8ff;">
    <table class="wrapper" border="0" cellpadding="0" cellspacing="0" width="100%" style="width: 100%;
        table-layout: fixed;">
        <thead>
            <tr><th></th></tr>
        </thead>
        <tr>
            <td align="center" style="background: linear-gradient(to bottom, #cceeff 0%, #f0f8ff 100%);
                background-color: #cceeff;">
                <table border="0" cellpadding="0" cellspacing="0" width="100%">
                    <thead>
                        <tr><th></th></tr>
                    </thead>
                    <tr>
                        <td align="center">
                            <table class="content-table" border="0" cellpadding="0" cellspacing="0"
                                width="900" style="width: 900px; max-width: 900px; margin: 0 auto;">
                                <thead>
                                    <tr><th></th></tr>
                                </thead>
                                <tr>
                                    <td align="center" style="padding-top: 30px; padding-bottom: 60px;"><img
                                            src="https://imagedelivery.net/3zjriYSbvISD3eo3SXBViA/jeeves/novu/images/jeeves-digest-layout-logo/public"
                                            alt="Logo" width="150" style="display: block;"></td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>
                <table border="0" cellpadding="0" cellspacing="0" width="100%">
                    <thead>
                        <tr><th></th></tr>
                    </thead>
                    <tr>
                        <td align="center">
                            <table class="content-table" border="0" cellpadding="0" cellspacing="0"
                                width="900" style="width: 900px; max-width: 900px; background-color: #ffffff;
                                border-radius: 12px; margin-top: -30px; position: relative; box-shadow: 0 4px 15px
                                rgba(0,0,0,0.05);">
                                <thead>
                                    <tr><th></th></tr>
                                </thead>
                                <tr>
                                    <td class="mobile-padding" style="padding: 30px; font-family: sans-serif;
                                        font-size: 16px; line-height: 1.6; color: #333333;">{{{body}}}</td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>
                <table border="0" cellpadding="0" cellspacing="0" width="100%">
                    <thead>
                        <tr><th></th></tr>
                    </thead>
                    <tr>
                        <td height="50">&nbsp;</td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
