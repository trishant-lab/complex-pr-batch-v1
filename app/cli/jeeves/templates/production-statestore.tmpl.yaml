kind: Component
metadata:
  name: statestore
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: cache-new.{{tenant}}.svc.cluster.local:6379
    - name: redisPassword
      value: {{redis_admin_password}}
    - name: actorStateStore #Specifies whether the state store is being used for actor state data.
      value: "true"
    - name: keyPrefix
      value: none