name: "Deploy Launchpad App"

on:
    workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Kubernetes
    runs-on: [self-hosted, python3.11]
    steps:
      - name: Deploy to Kubernetes SPRINT
        if: github.ref_name == 'sprint'
        run: |
          kubectl rollout restart deployment launchpad -n launchpad
          kubectl rollout restart deployment launchpad-cli -n launchpad
