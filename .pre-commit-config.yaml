default_stages:
  - pre-commit
repos:
  - repo: 'https://github.com/charliermarsh/ruff-pre-commit'
    rev: v0.4.1
    hooks:
      - id: ruff-format
      - id: ruff
  - repo: 'https://github.com/PyCQA/bandit'
    rev: 1.7.9
    hooks:
      - id: bandit
        args:
          - '-c'
          - pyproject.toml
          - '-r'
          - '-ll'
        additional_dependencies:
          - '.[toml]'
  - repo: local
    hooks:
      - id: osv-scanner
        name: osv-scanner
        entry: osv-scanner --lockfile=poetry.lock --config=osv-scanner.config.toml
        language: system
        always_run: true
        pass_filenames: false
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.16.1
    hooks:
      - id: gitleaks